version: "3.9"

services:
  nginx:
    image: nginx:latest
    container_name: mediatek_nginx
    ports:
      - "8080:80"
    volumes:
      - ./app/mediatekformation:/var/www/mediatekformation
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build: ./docker/php
    container_name: mediatek_php
    volumes:
      - ./app/mediatekformation:/var/www/mediatekformation
    working_dir: /var/www/mediatekformation
    environment:
      APP_ENV: dev
      APP_SECRET: ${PHP_APP_SECRET}
      DATABASE_URL: ${PHP_DATABASE_URL}

  db:
    image: mysql:8.0
    container_name: mediatek_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mediatekformation
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: mediatek_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_MYSQL_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: