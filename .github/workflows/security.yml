name: Security

on:
  schedule:
    - cron: '0 7 * * 1'   # tous les lundis
  push:
    paths: ['composer.lock'] # se lance quand une dépendance est mise à jour

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --no-progress
      - run: composer audit # vérifie les vulnérabilités dans les dépendances