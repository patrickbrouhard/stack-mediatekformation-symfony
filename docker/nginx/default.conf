server {
    # Le serveur écoute sur le port 80 (HTTP)
    listen 80;

    # Nom du serveur (ici mediatekformation, utile pour le routing virtuel)
    server_name mediatekformation;

    # Répertoire racine du projet Symfony (le dossier public)
    root /var/www/mediatekformation/public;

    # Fichier index par défaut
    index index.php;

    # Gestion des requêtes HTTP classiques
    location / {
        # try_files vérifie si le fichier demandé existe.
        # Si non, il redirige vers index.php avec les paramètres GET.
        try_files $uri /index.php$is_args$args;
    }

    # Gestion des fichiers PHP
    location ~ \.php$ {
        # Envoie les requêtes PHP au service PHP-FPM du conteneur "php" sur le port 9000
        fastcgi_pass php:9000;

        # Charge les paramètres FastCGI par défaut
        include fastcgi_params;

        # Indique à PHP-FPM quel fichier exécuter
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Sécurise les fichiers .htaccess ou similaires (Apache)
    location ~ /\.ht {
        deny all;
    }
}